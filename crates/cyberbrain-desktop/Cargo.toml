[package]
name = "cyberbrain-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Windows desktop launcher for Cyberbrain: a Start menu entry instead of a terminal"
keywords = ["ai-agents", "memory", "windows", "desktop"]
categories = ["command-line-utilities"]
# Not a library and useless without the installer that places it next to cyberbrain.exe,
# so it ships through the release page rather than crates.io.
publish = false

[[bin]]
name = "cyberbrain-desktop"
path = "src/main.rs"

[dependencies]
# The launcher's own state: which project was open last. Same two crates the rest of the
# workspace uses for its files, so the format is one people already know from cyberbrain.toml.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"

[target.'cfg(windows)'.dependencies]
# `default-features = false` on both, and it is not a size micro-optimisation: their
# defaults are the Linux arms — GTK3 through libappindicator for the tray, xdg-portal and
# Wayland for the dialog. None of that is compiled here, but it is in the dependency graph
# that cargo-deny reads, where the archived GTK3 bindings show up as an advisory about code
# this project never builds. On Windows neither default contributes anything.
tray-icon = { version = "0.24.2", default-features = false }
rfd = { version = "0.17.2", default-features = false }
# The tray wants straight RGBA; the icon is a PNG so that one file feeds the tray, the
# installer and the shortcut. This is the only decoder in the graph.
png = "0.18.1"
# The page in a window of its own. WebView2 is Microsoft's own COM API and its runtime is
# part of Windows 10 and 11, so this is a binding, not an engine: nothing is downloaded at
# build time either, because webview2-com-sys carries the import libraries in the crate.
#
# Measured before it was chosen, because it is the first dependency of this kind here. This
# adds 13 crates to the workspace lock file, all of them Microsoft's own windows-rs family.
# `wry`, the obvious alternative, adds 109 — an HTML and CSS parsing stack (html5ever,
# selectors, cssparser, string_cache) and bindings for Android and iOS, all of it in the
# lock file of a launcher that runs on Windows and nowhere else, all of it read by
# cargo-deny. The price of the smaller graph is the window below being ours to write.
webview2-com = "0.38.2"
# The typed half of windows-rs, which webview2-com already speaks. `windows-sys` stays for
# everything in `sys`: they are two views of the same API and neither is being replaced.
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

