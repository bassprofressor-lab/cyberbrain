[package]
name = "cyberbrain-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cyberbrain: llm"

[dependencies]
cyberbrain-core.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
