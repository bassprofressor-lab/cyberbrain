[package]
name = "cyberbrain-embed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "In-process static embeddings with a hash-verified model artefact, for Cyberbrain"

[features]
# Exposes `synthetic::write_synthetic_model` so other crates' tests can build a tiny
# model2vec-format artefact in a temp dir instead of needing a real model file.
synthetic = []

[dependencies]
cyberbrain-core.workspace = true
# rayon: a cold start hashes the 512 MB weights on every core (142 ms -> 17 ms measured).
blake3 = { version = "1.8.7", features = ["rayon"] }
# The weights are read from a mapping rather than copied (SPEC §6.5); MIT OR Apache-2.0.
memmap2 = "0.9.11"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3.27.0"
