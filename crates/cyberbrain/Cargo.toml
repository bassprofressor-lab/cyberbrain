[package]
name = "cyberbrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "cyberbrain"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
cyberbrain-core.workspace = true
cyberbrain-embed.workspace = true
cyberbrain-index.workspace = true
cyberbrain-llm.workspace = true
cyberbrain-policy.workspace = true
rust-embed = "8.12.0"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
