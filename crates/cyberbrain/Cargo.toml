[package]
name = "cyberbrain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
# `cargo package` takes nothing from outside this directory and, without `include`, nothing
# that .gitignore excludes. The web page is both: built to ui/dist at the repository root
# and copied here by the release step (see README, "Releasing"). Listing it explicitly is
# the only way a published crate can carry the page that `--features ui` embeds.
readme = "README.md"
include = ["src/**", "build.rs", "README.md", "LICENSE.md", "ui-dist/**"]

[[bin]]
name = "cyberbrain"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
# The hub's own record and its device tokens. SQLite is already in the tree through
# cyberbrain-index, and blake3 through the audit chain; neither is new C or a new licence.
blake3 = "1.8.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
# Licence signatures. Ed25519 in pure Rust: no C toolchain, and the public half is a
# compile-time constant so a hub checks a licence with nothing but itself.
ed25519-dalek = "3.0.0"
# Only for the one place a key pair is generated. Already in the tree; named here because a
# dependency used through somebody else's re-export is one nobody can find later.
getrandom = "0.4.3"
cyberbrain-code.workspace = true
cyberbrain-core.workspace = true
cyberbrain-embed.workspace = true
cyberbrain-index.workspace = true
cyberbrain-llm.workspace = true
cyberbrain-policy = { workspace = true, features = ["llm"] }
jiff = { version = "0.2.35", features = ["serde"] }
mime_guess = { version = "2.0.5", optional = true }
rust-embed = { version = "8.12.0", optional = true, features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync"] }
toml = "1.1.5"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ulid = { version = "3.0.0", features = ["serde"] }
argon2 = "0.6.0"

# The hub terminates its own TLS. Not one of these is new in the graph: reqwest in
# cyberbrain-policy already brings rustls, tokio-rustls, hyper and hyper-util, and sha2 comes
# with the signature crates. What is new is that this binary now names them, because it
# serves with them rather than only calling out through them. A reverse proxy would have been
# less code here and a second service to install on every customer's machine, which is the
# kind of trade that looks cheap in a repository and expensive in the field.
# Server side only, and provably: no `client` feature, no default features. hyper itself is
# not named here because nothing in this crate names it — the connection builder comes from
# hyper-util and takes the ALPN result from rustls, so both protocols are served without this
# binary ever holding a hyper type of its own.
hyper-util = { version = "0.1.20", default-features = false, features = ["server", "server-auto", "http1", "http2", "tokio", "service"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# PEM reading lives in pki-types now, so there is no rustls-pemfile here on purpose.
# Making the hub's own certificate when the operator has none to give. Pinned to the ring
# backend that rustls already uses: the alternative backend wants a C toolchain at build
# time, which would put a cmake on the path between a Windows release and a hub that can be
# reached over https.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
sha2 = "0.11.0"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }

# The hub runs as a Windows service, and a service is the only way it can be up before
# anybody logs in — which is what makes silence from a client a usable signal.
# windows-sys ^0.61 is the version the workspace already pulls, so this adds no second copy.
[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
# The pseudo-console behind the terminal. No new crate in the graph: windows-sys is already
# here through the workspace, and these are feature flags on it.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# The same thing on the machine this is built and tested on. A terminal that only exists on
# the platform nobody here can run is a terminal nobody here can test.
libc = "0.2.189"

[features]
# The web UI is compiled into the binary from the built page: `ui/dist` in a checkout,
# `ui-dist` here in a published crate (see `include` above and `ui_dir` in build.rs).
# Building it needs a node toolchain, which must not be the price of `cargo install` —
# with `--no-default-features` the CLI, the hooks and the MCP server are unaffected and
# `serve` answers the API while saying the page was not built in.
default = ["ui"]
ui = ["dep:rust-embed", "dep:mime_guess"]

[dev-dependencies]
tempfile = "3.27.0"

# Tests build a tiny synthetic model2vec artefact so the vector path is exercised end to
# end without a real model or a network. The feature is dev-only: the shipped binary never
# has a way to fabricate weights.
[dev-dependencies.cyberbrain-embed]
workspace = true
features = ["synthetic"]
