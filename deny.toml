# Enforces SPEC.md §2: no GPL/AGPL anywhere in the tree, direct or transitive.
[licenses]
version = 2
allow = [
  # Our own crates. Obvious in hindsight and missed on the first pass: this list was
  # written for other people's code and then applied to the whole graph, which includes
  # all seven of ours.
  "FSL-1.1-ALv2",

  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  "MPL-2.0", "Unicode-3.0", "CC0-1.0", "Unlicense",
  # Only reachable with `--all-features`, through a root-certificate bundle that this
  # build never links: §12.1 says no root store is compiled in, and `cargo tree` on the
  # real feature set confirms it. Allowed so the licence check does not trip over a
  # dependency nobody enables; it is permissive either way.
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# A native-tls path would drag in OpenSSL and break the no-C-toolchain rule (SPEC §15).
deny = [{ name = "native-tls" }, { name = "openssl-sys" }]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is unmaintained (RUSTSEC-2024-0436). It is a proc-macro reached only through
  # `tokenizers`: it runs at build time, expands to token pasting, and no part of it exists
  # in the shipped binary. Listed individually with the reason rather than switching the
  # unmaintained check off, so the next unmaintained crate still stops the build.
  { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro via tokenizers; nothing of it ships" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
