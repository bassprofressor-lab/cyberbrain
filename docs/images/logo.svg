<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 18 18" role="img" aria-label="Cyberbrain">
  <title>Cyberbrain</title>
  <!-- The rings, from the outside in: r4 unverified and dashed, r2 curated, r0 the operator's
       invariants at the centre. Same shapes the web UI draws, as a standalone file. -->
  <circle cx="9" cy="9" r="8" fill="none" stroke="#9aa0ad" stroke-width="1.2" stroke-dasharray="2 1.5"/>
  <circle cx="9" cy="9" r="5.6" fill="none" stroke="#3ecfb2" stroke-width="1.4"/>
  <circle cx="9" cy="9" r="3" fill="#e879c7"/>
</svg>
