[workspace]
resolver = "3"
members = ["crates/*"]
# Third-party crates patched in place; not part of the workspace (no tests, no clippy of ours).
exclude = ["vendor"]

[workspace.package]
version = "0.10.4"
edition = "2024"
rust-version = "1.98"
license = "FSL-1.1-ALv2"
authors = ["Krynex Labs <info@krynexlabs.de>"]
repository = "https://github.com/bassprofressor-lab/cyberbrain"
homepage = "https://krynexlabs.de"
description = "Cited, trust-tiered, local-first memory for AI coding agents"
keywords = ["ai-agents", "memory", "retrieval", "mcp", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
cyberbrain-core   = { path = "crates/cyberbrain-core",   version = "0.10.4" }
cyberbrain-embed  = { path = "crates/cyberbrain-embed",  version = "0.10.4" }
cyberbrain-index  = { path = "crates/cyberbrain-index",  version = "0.10.4" }
cyberbrain-policy = { path = "crates/cyberbrain-policy", version = "0.10.4" }
cyberbrain-llm    = { path = "crates/cyberbrain-llm",    version = "0.10.4" }
cyberbrain-code   = { path = "crates/cyberbrain-code",   version = "0.10.4" }
cyberbrain-documents = { path = "crates/cyberbrain-documents", version = "0.10.4" }

# oar-ocr 0.10.2 (newest on crates.io, needed by the `documents` feature) requires zip 8.x, which
# carries RUSTSEC-2026-0367/0368/0369/0429. vendor/oar-ocr is that release with zip raised to
# 9.0.5, nothing else changed. A [patch] applies to builds from this repository (the release
# binaries); a crate published to crates.io still resolves the upstream oar-ocr. Remove both
# as soon as oar-ocr allows zip >= 9.0.5.
[patch.crates-io]
oar-ocr = { path = "vendor/oar-ocr" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# `panic = "abort"` was here and it quietly defeated SPEC §9.1. A hook must never fail the
# harness, which is implemented by catching a panic and exiting 0 — and `abort` means there
# is nothing to catch. The binary would have taken down the agent it serves, in release
# builds only, which is the worst place for a difference like that to live.
#
# Unwinding costs some binary size and a little speed. The guarantee is worth more: a memory
# tool that can kill the session it is remembering for gets uninstalled the first time.
panic = "unwind"

[profile.bench]
inherits = "release"
