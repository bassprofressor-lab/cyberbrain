name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # `--no-default-features` leaves the `ui` feature off, so this job needs no node
      # toolchain and no built page. The embed is proven by the `ui` job below, which
      # builds the page first. Running the default features here would fail in the build
      # script on a checkout, where `ui/dist` does not exist.
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # The audit export format claims to be checkable without this program, and
      # `scripts/verify-audit-export.py` is the second implementation that proves it. Without
      # blake3 that test skips itself — loudly, but it skips — so one job installs it and
      # actually runs the comparison.
      - if: matrix.os == 'ubuntu-latest'
        run: pip install --break-system-packages blake3
      - run: cargo test --workspace --no-default-features

  # The installer is the only artefact nobody can try on the machine that writes it, so it
  # gets built on every push rather than first at release time, where a typo in the script
  # would surface with a tag already public.
  desktop-installer:
    name: desktop launcher and installer
    runs-on: windows-latest
    # On the job rather than on the step that uses it: a step's own `env:` is not visible to
    # that step's `if`, so the condition would have read empty and the check would have
    # skipped itself for ever, quietly.
    env:
      HUB_TEST_LICENCE: ${{ secrets.HUB_TEST_LICENCE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The page, before the binary. This job used to build --no-default-features, which is
      # a supported build and is not the product: the installer it produced put a Start menu
      # entry on a browser tab reading `"code": "not-found"`. An artefact offered for people
      # to try has to be the thing they would get.
      - name: build the embedded page
        run: npm ci && npm run build
        working-directory: ui

      - run: cargo build --release -p cyberbrain -p cyberbrain-desktop
      - shell: bash
        run: |
          if ! command -v makensis > /dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          staging="$(pwd)/target/release"
          cp crates/cyberbrain-desktop/assets/cyberbrain.ico "$staging/"
          cp LICENSE.md "$staging/LICENSE.txt"
          cd packaging/windows
          makensis -DVERSION=0.0.0-ci -DVIVERSION=0.0.0 "-DSOURCE=$staging" cyberbrain.nsi
          test -f cyberbrain-setup-0.0.0-ci.exe

      # The one artefact nobody here can click. Uploading it from every push is how a
      # person with a Windows machine gets to try the current state without a release.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: packaging/windows/cyberbrain-setup-0.0.0-ci.exe

      # Everything below is here because building an installer proves nothing about
      # installing one. Two faults reached a person's machine on 2026-09-09 that this would
      # have caught before it left: the hub treated its own certificate as somebody else's
      # because the service is registered with paths rather than with --tls-generate, and
      # the private key was readable by every account on the machine through an inherited
      # ACL. Neither is visible from Linux, and neither needs a human to see it.
      - name: install it the way a customer would
        shell: pwsh
        run: |
          $setup = "packaging/windows/cyberbrain-setup-0.0.0-ci.exe"
          # /S is silent, /HUB selects the collector service — the same two switches an
          # unattended rollout uses.
          $p = Start-Process -FilePath $setup -ArgumentList '/S','/HUB' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Cyberbrain"
          foreach ($f in 'cyberbrain.exe','cyberbrain-desktop.exe','uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$f was not installed" }
          }

      - name: the hub made itself a certificate and knows it is its own
        shell: pwsh
        run: |
          $data = "$env:ProgramData\Cyberbrain"
          foreach ($f in 'hub-cert.pem','hub-key.pem') {
            if (-not (Test-Path "$data\$f")) { throw "$f is missing: the installer did not make one" }
          }

          # The registration has to carry the certificate, or an upgrade drops back to
          # plain text without anybody noticing.
          $config = (sc.exe qc CyberbrainHub) -join "`n"
          foreach ($flag in '--tls-cert','--tls-key') {
            if ($config -notmatch [regex]::Escape($flag)) { throw "the service is registered without $flag :`n$config" }
          }

          # The service writes its first lines on start. It is registered as auto-start and
          # started by the installer, so this is a wait for a file, not for a person.
          $log = "$data\hub-service.log"
          $deadline = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $text = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          } while ($text -notmatch 'cyberbrain hub: ' -and (Get-Date) -lt $deadline)
          Write-Host $text
          if ($text -notmatch 'cyberbrain hub: https://') { throw "the hub is not serving https" }
          # The half that went missing in the field: without it the pin never reaches an
          # invitation and every client refuses the certificate.
          if ($text -notmatch '\(invitations pin this\)') {
            throw "the hub does not recognise its own certificate as its own"
          }

          # And the number the program reports is the number in its log.
          $shown = & "$env:ProgramFiles\Cyberbrain\cyberbrain.exe" hub cert show --data "$data\hub.db"
          Write-Host ($shown -join "`n")
          $fromLog = [regex]::Match($text, 'certificate SHA-256: ([0-9A-F:]+)').Groups[1].Value
          if (-not ($shown -join ' ').Contains($fromLog)) { throw "cert show and the log disagree about the fingerprint" }

      - name: nobody but an administrator can read the key
        shell: pwsh
        run: |
          $acl = (icacls "$env:ProgramData\Cyberbrain\hub-key.pem") -join "`n"
          Write-Host $acl
          # Measured on a real machine before this check existed: the key inherited
          # C:\ProgramData's ACL, which grants BUILTIN\Users read.
          if ($acl -match 'BUILTIN\\Users') { throw "the private key is readable by every account on the machine:`n$acl" }
          foreach ($who in 'NT AUTHORITY\\SYSTEM','BUILTIN\\Administrators') {
            if ($acl -notmatch $who) { throw "$who cannot reach the key:`n$acl" }
          }

      - name: the program is on the PATH, and a note can be delivered to the hub
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable('Path','Machine')
          if ($machine -notmatch [regex]::Escape("$env:ProgramFiles\Cyberbrain")) {
            throw "the install directory is not on the machine PATH"
          }
          # A process started now inherits this job's environment, not the new one, so the
          # PATH is refreshed here rather than trusting the variable that was read at start.
          $env:PATH = $machine + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          cyberbrain --version
          if ($LASTEXITCODE -ne 0) { throw "cyberbrain is not resolvable by name" }

      # The rest of the chain — an invitation carrying the fingerprint, a client that pins
      # it, a delivery, and the refusal when the pin is wrong — needs a licence, and only
      # the issuer can sign one. It runs when the repository has HUB_TEST_LICENCE set and is
      # skipped without a word otherwise, because a check that quietly passes when it did
      # not run is worse than no check.
      - name: a pinned client delivers, and a wrong pin does not
        if: ${{ env.HUB_TEST_LICENCE != '' }}
        shell: pwsh
        run: |
          $data = "$env:ProgramData\Cyberbrain"
          $exe = "$env:ProgramFiles\Cyberbrain\cyberbrain.exe"
          Set-Content -Path "$data\licence.txt" -Value $env:HUB_TEST_LICENCE
          Restart-Service CyberbrainHub
          Start-Sleep -Seconds 5

          & $exe hub add ci-client --data "$data\hub.db" --invite "$env:RUNNER_TEMP\invite.json" --hub-url "https://$env:COMPUTERNAME:7788"
          $invite = Get-Content "$env:RUNNER_TEMP\invite.json" -Raw | ConvertFrom-Json
          if (-not $invite.hub_cert_sha256) { throw "the invitation carries no certificate to pin" }
          if ($invite.version -ne 2) { throw "the invitation is version $($invite.version)" }

          $store = "$env:RUNNER_TEMP\ci-store"
          New-Item -ItemType Directory -Path $store | Out-Null
          Push-Location $store
          & $exe init
          & $exe hub enrol "$env:RUNNER_TEMP\invite.json"
          & $exe write --ring 2 --kind knowledge --name ci-note --body 'A row to deliver.'
          & $exe hub push
          if ($LASTEXITCODE -ne 0) { throw "a pinned delivery failed" }

          # And the other direction, which is the whole point of a pin: a hub presenting
          # something else is not this hub.
          $pin = Get-ChildItem "$env:APPDATA\cyberbrain\hub-tokens\*.pin" | Select-Object -First 1
          $good = Get-Content $pin -Raw
          Set-Content -Path $pin -Value ($good -replace '^..', 'FF')
          $out = (& $exe hub push 2>&1) -join ' '
          if ($LASTEXITCODE -eq 0) { throw "a delivery went through with the wrong certificate pinned" }
          if ($out -notmatch 'different certificate') { throw "the refusal does not say what was wrong: $out" }
          Set-Content -Path $pin -Value $good
          Pop-Location
          # The failure above was the point of the step, and a pwsh step ends with
          # `exit $LASTEXITCODE`: left alone, passing this check would fail the job.
          $global:LASTEXITCODE = 0

      - name: uninstalling takes the service and the PATH entry with it
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$env:ProgramFiles\Cyberbrain\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited $($p.ExitCode)" }
          Start-Sleep -Seconds 5
          sc.exe query CyberbrainHub 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the service is still registered" }
          $machine = [Environment]::GetEnvironmentVariable('Path','Machine')
          if ($machine -match [regex]::Escape("$env:ProgramFiles\Cyberbrain")) {
            throw "the PATH still points at a directory that is gone"
          }
          # The record is deliberately left behind: it is the evidence, and removing the
          # software must not remove it.
          if (-not (Test-Path "$env:ProgramData\Cyberbrain\hub.db")) { throw "uninstalling deleted the record" }
          # `sc query` was meant to fail; see above.
          $global:LASTEXITCODE = 0

  # SPEC §9.1: the Windows hook has to survive cmd.exe. A job that only compiles proves
  # nothing about quoting, spaces in paths, or the absence of a POSIX shell — the failures
  # this is here to catch all happen at invocation, not at build.
  windows-hook:
    name: windows hook through cmd.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cyberbrain --no-default-features
      - name: install into a path containing a space
        shell: cmd
        run: |
          mkdir "C:\Program Files\cyberbrain test"
          copy target\release\cyberbrain.exe "C:\Program Files\cyberbrain test\"
      - name: run each hook through cmd.exe
        shell: cmd
        run: |
          cd %RUNNER_TEMP%
          "C:\Program Files\cyberbrain test\cyberbrain.exe" init --store .cyberbrain || exit /b 1
          for %%E in (session-start user-prompt-submit pre-tool-use post-tool-use stop pre-compact) do (
            echo {} | "C:\Program Files\cyberbrain test\cyberbrain.exe" hook %%E || exit /b 1
          )

  # SPEC §15: what matters to a user is that the shipped binary needs nothing at runtime.
  # Built on the toolchain image, run on a bare one.
  bare-runtime:
    name: release binary runs on a bare image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p cyberbrain --no-default-features
      - name: run it where no toolchain, sqlite or openssl exists
        run: |
          docker run --rm -v "$PWD/target/release/cyberbrain:/cyberbrain:ro" \
            debian:trixie-slim /cyberbrain --version

  licences:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The action runs in its own container without our pinned toolchain, and
      # `rust-toolchain.toml` would make it try to fetch one it does not need: cargo-deny
      # reads manifests and the lockfile, it does not compile anything.
      - name: keep the toolchain pin out of the deny container
        run: mv rust-toolchain.toml rust-toolchain.toml.off
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - run: mv rust-toolchain.toml.off rust-toolchain.toml
      # From v5 the action caches on its own. The lock file is in ui/, not at the root, so
      # that lookup would fail; the page is small enough that no cache is the honest default.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # SPEC §2 applies to the JS tree as well: one AGPL dependency anywhere and the
      # project's own licence becomes a claim it cannot keep.
      - run: npm ci && npm run licenses
        working-directory: ui

  # SPEC §15: no build script may pull in a C++ toolchain or cmake without it being a
  # decision. `cc` for bundled SQLite is the whole permitted list.
  c-footprint:
    name: build-time C footprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo tree --workspace --edges normal,build --prefix none --format "{p}" | sort -u > /tmp/deps.txt
      - name: refuse cmake, aws-lc-sys, openssl-sys, native-tls
        run: |
          if grep -Ei '^(cmake|aws-lc-sys|openssl-sys|native-tls) ' /tmp/deps.txt; then
            echo "::error::a banned build-time dependency entered the tree (SPEC §15)"
            exit 1
          fi

  ui:
    name: ui builds and typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # From v5 the action caches on its own. The lock file is in ui/, not at the root, so
      # that lookup would fail; the page is small enough that no cache is the honest default.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # The page exists now, so this is the one place the embed and its build-script
      # guard are exercised: a mock bundle here must fail the build.
      - run: cargo build --release -p cyberbrain --features ui
      # And the one place the launcher's tests can start a real server. The `test` job
      # builds --no-default-features, where `serve` has no page and refuses; there those
      # six stand down and say so. Release, because that is the binary just built: they
      # look for `cyberbrain` beside their own test binary.
      - run: cargo test --release -p cyberbrain-desktop

  benchmarks:
    name: performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # SPEC §15's budgets are only real if something measures them. Debug builds are
      # 15x slower and would either fail always or need a meaningless limit, so these
      # run in release and are #[ignore]d elsewhere.
      #
      # `--nocapture` because a green tick hides how close it was. The budget test may
      # measure a series up to three times, and one that quietly needs all three on every
      # run is a slow drift nobody would see without the numbers in the log.
      - run: cargo test --workspace --release --no-default-features -- --ignored --nocapture
