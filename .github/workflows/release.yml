# Binaries for a tag, so the install instruction can be "download and run" instead of
# "install two toolchains first".
#
# The page is built before the binary on every platform: `ui` is a default feature, the page
# lives at the repository root, and a release binary without it would serve a 404 where the
# README promises a web UI. `build.rs` refuses a mock bundle, so this cannot ship fabricated
# compliance figures by accident.
name: release

on:
  push:
    tags: ["v*"]
  # Buildable without a tag to prove the workflow itself, which is otherwise only ever
  # exercised at the worst possible moment.
  workflow_dispatch:

# Read by default. Only the job that attaches the binaries to the release may write, so a
# step in the build matrix cannot change the repository or the release with the job token.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # N4 (review 2026-11-19): a checksum file from the same run proves nothing about where a
    # binary came from; whoever can swap one can swap both. A build provenance attestation is
    # signed by GitHub for this workflow and commit: `gh attestation verify <file> --repo
    # <owner>/<repo>`. Writing one needs the OIDC token and the attestations scope, nothing
    # else; contents stays read.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not ubuntu-latest: latest moved to 26.04 and the 0.10.6 binary then needed
          # glibc 2.43, which Ubuntu 24.04 and Debian 13 do not have (2026-11-16).
          - os: ubuntu-24.04
            name: linux-x86_64
            bin: cyberbrain
          - os: windows-latest
            name: windows-x86_64
            bin: cyberbrain.exe
          # Apple silicon. The Claude Code plugin downloads the binary for the machine it runs
          # on, and without this asset it fails on every Mac (2026-10-04). Intel Macs are not
          # built: no plugin user has asked, and an untested binary is worse than none.
          - os: macos-latest
            name: macos-aarch64
            bin: cyberbrain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # From v5 the action caches on its own. The lock file is in ui/, not at the root, so
      # that lookup would fail; the page is small enough that no cache is the honest default.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # No rust-cache here. The cache is shared with ordinary CI runs, and whatever one of
      # them put in it would end up in the binaries people download. A release builds from
      # nothing; it is slower once per tag, which is the right price.

      - name: build the embedded page
        run: npm ci && npm run build
        working-directory: ui

      - name: build the binary
        run: cargo build --locked --release -p cyberbrain --features documents

      - name: it runs on glibc 2.39 (Ubuntu 24.04)
        if: matrix.name == 'linux-x86_64'
        shell: bash
        run: scripts/glibc-floor.sh target/release/cyberbrain 2.39

      # The tag says what it is; the binary has to agree. A release built from the wrong
      # commit is the kind of thing nobody notices until someone reports a fixed bug.
      - name: the binary agrees with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(target/release/${{ matrix.bin }} --version | awk '{print $2}')"
          test "$want" = "$got" || { echo "::error::tag $want, binary $got"; exit 1; }

      # Not a smoke test for its own sake: this is the first run on a machine that has never
      # seen a store, which is the state every new user is in.
      - name: it works on a machine that has never run it
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          B="$GITHUB_WORKSPACE/target/release/${{ matrix.bin }}"
          "$B" init
          "$B" write --ring 2 --kind knowledge --name release-check --body 'A release that cannot write a note is not a release.'
          "$B" scan
          "$B" recall 'release' | grep -q release-check
          "$B" policy egress | grep -q "Telemetry does not exist"
          echo '{}' | "$B" hook session-start > /dev/null

      # The desktop launcher and its installer, Windows only: this is the "install and
      # click" way in, and it only means anything on the platform that has a Start menu.
      - name: build the desktop launcher
        if: matrix.os == 'windows-latest'
        run: cargo build --locked --release -p cyberbrain-desktop

      - name: makensis is on the runner
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          if ! command -v makensis > /dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            choco install nsis -y --no-progress
          fi
          echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"

      - name: build the installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # The version comes from the manifest, not from the tag: a dispatch run has no
          # tag, and the tag is checked against the binary a few steps up anyway.
          version=$(cargo metadata --no-deps --format-version 1 \
            | python -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='cyberbrain'))")
          staging="$(pwd)/target/release"
          cp crates/cyberbrain-desktop/assets/cyberbrain.ico "$staging/"
          cp LICENSE.md "$staging/LICENSE.txt"
          cd packaging/windows
          # Four numbers for the version resource, so a pre-release suffix cannot break it.
          # -INPUTCHARSET UTF8: the script is UTF-8 without a BOM, and makensis on Windows reads
          # such a file in the ANSI code page, so every ä, ö, ü in the German texts came out as
          # Ã¤, Ã¶, Ã¼ (reported for 0.10.1; reproduced with -INPUTCHARSET CP1252).
          makensis -INPUTCHARSET UTF8 "-DVERSION=$version" "-DVIVERSION=${version%%-*}" "-DSOURCE=$staging" cyberbrain.nsi
          mv "cyberbrain-setup-$version.exe" "$GITHUB_WORKSPACE/"
          echo "INSTALLER=cyberbrain-setup-$version.exe" >> "$GITHUB_ENV"

      - name: name it after the platform and hash it
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/cyberbrain-${{ matrix.name }}${{ matrix.bin == 'cyberbrain.exe' && '.exe' || '' }}"
          if [ -n "${INSTALLER:-}" ]; then cp "$INSTALLER" dist/; fi
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum * > "SHA256SUMS-${{ matrix.name }}"; else shasum -a 256 * > "SHA256SUMS-${{ matrix.name }}"; fi
          cat "SHA256SUMS-${{ matrix.name }}"

      - name: attest where the files came from
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/cyberbrain-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}
          path: dist/*

  # The products built on this core, built and tested against it before anything is attached
  # to a release (review 2026-11-19: core 0.10.5/0.10.6 broke Cyberbrain Light and
  # cyberbrain-business, and nobody noticed because neither was built at release time). Red
  # here stops `publish`. scripts/check-dependents.sh says what is done to each; it runs the
  # same on a workstation.
  #
  # cyberbrain-business is private. The job needs the repository variable BUSINESS_REPOSITORY
  # (owner/name), optionally BUSINESS_REF (default main), and the secret
  # BUSINESS_CHECKOUT_TOKEN, a fine-grained token with read access to that repository's
  # contents and nothing else. Without them the job fails rather than passing unchecked: a
  # release that could not be checked against business is not one that was.
  dependents:
    name: ${{ matrix.product }} against this core
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        product: [light, business]
    steps:
      # Checked out as cyberbrain-p0, the name business's path dependencies expect next to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: cyberbrain-p0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.product == 'light'
        with:
          repository: bassprofressor-lab/cyberbrain-light
          path: light
          persist-credentials: false
      # business has no remote yet (20.11.2026). Until BUSINESS_REPOSITORY and BUSINESS_CHECKOUT_TOKEN
      # are set, this leg warns and is skipped; the release checklist then runs
      # scripts/check-dependents.sh against a local business checkout before tagging. Light is always checked.
      - name: business is configured
        id: cfg
        if: matrix.product == 'business'
        env:
          REPO: ${{ vars.BUSINESS_REPOSITORY }}
          HAS_TOKEN: ${{ secrets.BUSINESS_CHECKOUT_TOKEN != '' }}
        run: |
          if [ -z "$REPO" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::business not checked here: set the variable BUSINESS_REPOSITORY and the secret BUSINESS_CHECKOUT_TOKEN, and run scripts/check-dependents.sh locally before the tag"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: matrix.product == 'business' && steps.cfg.outputs.ok == 'true'
        with:
          repository: ${{ vars.BUSINESS_REPOSITORY }}
          ref: ${{ vars.BUSINESS_REF || 'main' }}
          token: ${{ secrets.BUSINESS_CHECKOUT_TOKEN }}
          path: business
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: matrix.product == 'light' || steps.cfg.outputs.ok == 'true'
      - name: build and test ${{ matrix.product }} against this core
        if: matrix.product == 'light' || steps.cfg.outputs.ok == 'true'
        run: cyberbrain-p0/scripts/check-dependents.sh cyberbrain-p0 ${{ matrix.product }} ${{ matrix.product }}

  publish:
    name: attach to the release
    needs: [build, dependents]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
      - name: one directory, one checksum file
        run: |
          mkdir -p out
          find dist -type f -not -name 'SHA256SUMS-*' -exec cp {} out/ \;
          cat dist/*/SHA256SUMS-* > out/SHA256SUMS
          ls -la out
      # A draft, not a publish: the release notes are written by a person, and the tag
      # existing is not the same as the release being ready to read.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          draft: true
          files: out/*
          body: |
            Binaries for ${{ github.ref_name }}. Verify with `sha256sum -c SHA256SUMS`, and where
            they came from with `gh attestation verify <file> --repo ${{ github.repository }}`.

            Nothing is needed at runtime: no system SQLite, no OpenSSL, no model server, no
            node. `cyberbrain --help` to start, `cyberbrain init` in a project.
