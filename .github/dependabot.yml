version: 2
updates:
  # The workflows pin every action to a commit; this keeps the pins from going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # N11 (review 2026-11-19): the crates and the two npm trees too, not only the actions.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
