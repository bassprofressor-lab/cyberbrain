<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Cyberbrain</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Theme before first paint. No flash, no dependency on React having mounted.
      (function () {
        try {
          var stored = localStorage.getItem("cyberbrain.theme");
          var sys = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : sys;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
